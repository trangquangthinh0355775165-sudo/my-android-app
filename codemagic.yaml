workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK
        script: |
          cd Galaxy
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - Galaxy/app/build/outputs/apk/**/*.apk
